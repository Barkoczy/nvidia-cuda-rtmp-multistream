user broadcaster;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_message 1M;

        application live {
            live on;
            record off;

            # Ultra-low buffer settings
            buffer 5s;

            # Rate Limiting: Max concurrent connections (global limit)
            # Prevents connection exhaustion from rogue clients or attacks
            # Phase 2: 50 connections = reasonable for local network with multiple profiles
            max_connections 50;

            # Secure webhook-based authorization
            on_publish http://webhook:8090/api/v1/publish;
            on_publish_done http://webhook:8090/api/v1/publish_done;

            # NGINX executes broadcaster/hls_transcode after webhook authorization
            exec_publish /usr/local/bin/hls_transcode $name start;
            exec_publish_done /usr/local/bin/hls_transcode $name stop;

            exec_publish /bin/bash -c "/usr/local/bin/broadcaster --profile $name 2>&1 >> /var/log/broadcaster/exec_debug.log";
            exec_publish_done /bin/bash -c "/usr/local/bin/broadcaster --profile $name --stop 2>&1 >> /var/log/broadcaster/exec_debug.log";

            # Drop idle connections to free resources
            drop_idle_publisher 10s;
        }
    }
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Rate Limiting Zones (Phase 2: Basic DoS protection)
    # 10MB zones = ~160k IP addresses tracked
    limit_req_zone $binary_remote_addr zone=status_page:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=hls_playback:10m rate=100r/m;
    limit_conn_zone $binary_remote_addr zone=http_conn:10m;

    # VTS (Virtual Host Traffic Status) module configuration
    vhost_traffic_status_zone;
    vhost_traffic_status_filter_by_set_key $server_name server::$server_name;

    # Core performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Extended timeout for proxy environments
    keepalive_timeout 120;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;

    # Hash optimizations
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    # Advanced I/O optimizations (without aio)
    directio 4m;
    output_buffers 2 1m;

    # Aggressive file caching
    open_file_cache max=10000 inactive=5s;
    open_file_cache_valid 10s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Performance logging format
    log_format streaming '[$time_local] $remote_addr $status $request_time';
    access_log /var/log/nginx/streaming.log streaming buffer=64k flush=5s;

    server {
        listen 8080 backlog=16384;

        # Rate Limiting: Limit concurrent HTTP connections per IP
        limit_conn http_conn 10;

        # RTMP stats access
        location /stat {
            # Rate Limiting: 10 requests/min per IP, burst of 5 for page refreshes
            limit_req zone=status_page burst=5 nodelay;
            limit_req_status 429;

            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Expose-Headers "Date, Server, Content-Type, Content-Length";
            add_header Refresh "3; $request_uri";
        }

        location /stat.xsl {
            root /var/www/html;
        }

        location /control {
            rtmp_control all;
            internal;
        }

        # Optimized LL-HLS delivery
        location /hls {
            # Rate Limiting: 100 requests/min per IP (HLS segment fetching)
            # Burst of 20 allows for rapid initial segment requests
            limit_req zone=hls_playback burst=20 nodelay;
            limit_req_status 429;

            # MIME Types for streaming formats
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                video/mp4 mp4 m4s;
            }
            root /tmp;

            # Disable gzip to prevent proxy issues
            gzip off;

            # Chunked transfer for partial playlist updates
            chunked_transfer_encoding on;

            # Master playlists - never cache
            location ~ \.m3u8$ {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Expose-Headers "Date, Server, Content-Type, Content-Length";
                add_header Cache-Control no-cache;
                expires -1;

                # Efficient buffer settings for playlists
                postpone_output 0;
                tcp_nodelay on;
            }

            # MP4 initialization segments - moderate cache
            location ~ init.*\.mp4$ {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Expose-Headers "Date, Server, Content-Type, Content-Length";
                add_header Cache-Control max-age=3600;
                expires 1h;
            }

            # Media segments - short cache
            location ~ \.m4s$ {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Expose-Headers "Date, Server, Content-Type, Content-Length";
                add_header Cache-Control max-age=1;
                expires 1s;

                # Optimized buffers for media segments
                postpone_output 0;
                tcp_nodelay on;

                # Proxy performance headers
                add_header X-Accel-Buffering no;
            }
        }

        # Performance monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # VTS (Virtual Host Traffic Status) metrics endpoint
        location /status {
            vhost_traffic_status_display;
            vhost_traffic_status_display_format json;
            access_log off;
        }

        # Log access
        location /logs {
            alias /var/log/broadcaster;
            autoindex on;
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # Efficient directory listings
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    }
}
