services:
  # Webhook server for secure RTMP event handling
  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: webhook-staging
    restart: unless-stopped
    ports:
      - "8090:8090"  # Webhook API endpoint
    environment:
      - WEBHOOK_PORT=8090
    networks:
      - streaming
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx-rtmp-staging:
    build:
      context: .
      args:
        - USE_NVIDIA=true
    ports:
      - "1936:1935" # RTMP (staging)
      - "8081:8080" # HTTP status page (staging)
    container_name: nginx-rtmp-staging
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ./logs-staging:/var/log/broadcaster
      - ./profiles.yml:/etc/broadcaster/profiles.yml:ro
      - ./nginx.staging.conf:/usr/local/nginx/conf/nginx.conf:ro
      - /tmp/hls:/tmp/hls
    secrets:
      - gaming_youtube_key
      - gaming_twitch_key
      - gaming_kick_key
      - gaming_x_key
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - streaming
    depends_on:
      webhook:
        condition: service_healthy

secrets:
  gaming_youtube_key:
    file: ./secrets/gaming_youtube_key.txt
  gaming_twitch_key:
    file: ./secrets/gaming_twitch_key.txt
  gaming_kick_key:
    file: ./secrets/gaming_kick_key.txt
  gaming_x_key:
    file: ./secrets/gaming_x_key.txt

networks:
  streaming:
    driver: bridge
