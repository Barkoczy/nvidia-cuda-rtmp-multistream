services:
  # Webhook server for secure RTMP event handling
  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: webhook-staging
    restart: unless-stopped
    # NO external ports - internal Docker network only
    expose:
      - "8090"
    environment:
      - WEBHOOK_PORT=8090
    networks:
      - streaming
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx-rtmp-staging:
    image: nvidia-cuda-rtmp-multistream-nginx-rtmp-staging:latest
    build:
      context: .
      dockerfile: Dockerfile.hardened
      args:
        - USE_NVIDIA=true
    ports:
      - "1936:1935" # RTMP (staging)
      - "8081:8080" # HTTP status page (staging)
    container_name: nginx-rtmp-staging
    # Note: Container starts as root for entrypoint setup (GPU, chown), NGINX runs as broadcaster user
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ./logs-staging:/var/log/broadcaster
      - ./profiles.yml:/etc/broadcaster/profiles.yml:ro
      - ./nginx.staging.conf:/usr/local/nginx/conf/nginx.conf:ro
      - /tmp/hls:/tmp/hls
    # Tmpfs volumes for read-only root filesystem
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx
      - /usr/local/nginx/logs
      - /usr/local/nginx/client_body_temp
      - /usr/local/nginx/proxy_temp
      - /usr/local/nginx/fastcgi_temp
      - /usr/local/nginx/uwsgi_temp
      - /usr/local/nginx/scgi_temp
    secrets:
      - gaming_youtube_key
      - gaming_twitch_key
      - gaming_kick_key
      - gaming_x_key
    # Security: Read-only root filesystem
    read_only: true
    # Security: Drop all capabilities except required ones
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # For log file ownership
      - DAC_OVERRIDE   # For writing to mounted volumes
      - SETGID         # For group changes
      - SETUID         # For user changes
      - NET_BIND_SERVICE  # For binding to ports
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    restart: unless-stopped
    networks:
      - streaming
    depends_on:
      webhook:
        condition: service_healthy

  # Observability Stack
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus-staging
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'  # Add size limit
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - streaming
    # Security: User (official image already uses nobody:65534)
    user: "65534:65534"
    # Security: Read-only root filesystem (TSDB needs write to /prometheus)
    read_only: true
    tmpfs:
      - /tmp
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    depends_on:
      - webhook

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana-staging
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.grafana
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    networks:
      - streaming
    # Security: User (official image uses grafana:472)
    user: "472:0"
    # Security: Read-only root filesystem (NOT possible - Grafana needs RW for DB)
    # Skipping read_only for Grafana
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN         # For data directory ownership
      - DAC_OVERRIDE  # For writing to volumes
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.3
    container_name: loki-staging
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - streaming
    # Security: User (official image uses loki:10001)
    user: "10001:10001"
    # Security: Read-only root filesystem (NOT possible - needs RW for TSDB)
    # Skipping read_only for Loki
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail-staging
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs-staging:/var/log/broadcaster:ro
    networks:
      - streaming
    # Security: User (needs root for Docker socket access)
    # Cannot change user for Promtail - requires Docker socket access
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp
    # Security: Drop capabilities (limited - needs Docker access)
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH  # For reading log files
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    depends_on:
      - loki

  # Node exporter for host metrics
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter-staging
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - streaming
    ports:
      - "9100:9100"
    # Security: User (official image uses nobody:65534)
    user: "65534:65534"
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor-staging
    restart: unless-stopped
    # Security: EXCEPTION - cAdvisor requires privileged mode by design
    # Required for container metrics collection from /sys, /dev, cgroups
    # CIS 5.4 exception documented - trade-off for observability
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    networks:
      - streaming

  # NVIDIA DCGM exporter for GPU metrics
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter-staging
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]
    networks:
      - streaming
    # Security: User (NVIDIA images may require root for GPU access)
    # Checking official image default, may need root for NVML library
    # Security: Read-only root filesystem (GPU metrics only, no writes needed)
    read_only: true
    tmpfs:
      - /tmp
    # Security: Drop capabilities where possible (GPU access may require some)
    cap_drop:
      - ALL
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true

  # NGINX VTS exporter for RTMP metrics
  nginx-vts-exporter:
    image: sophos/nginx-vts-exporter:latest
    container_name: nginx-vts-exporter-staging
    restart: unless-stopped
    environment:
      - NGINX_STATUS=http://nginx-rtmp-staging:8080/status/format/json
    command:
      - '-nginx.scrape_uri=http://nginx-rtmp-staging:8080/status/format/json'
    ports:
      - "9913:9913"
    networks:
      - streaming
    depends_on:
      - nginx-rtmp-staging
    # Security: User (exporter images typically use nobody/non-root)
    user: "65534:65534"
    # Security: Read-only root filesystem (metrics scraper, no writes)
    read_only: true
    tmpfs:
      - /tmp
    # Security: Drop all capabilities
    cap_drop:
      - ALL
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true

secrets:
  gaming_youtube_key:
    file: ./secrets/gaming_youtube_key.txt
  gaming_twitch_key:
    file: ./secrets/gaming_twitch_key.txt
  gaming_kick_key:
    file: ./secrets/gaming_kick_key.txt
  gaming_x_key:
    file: ./secrets/gaming_x_key.txt

networks:
  streaming:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
