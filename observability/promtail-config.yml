server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Broadcaster logs from mounted volume
  - job_name: broadcaster
    static_configs:
      - targets:
          - localhost
        labels:
          job: broadcaster
          __path__: /var/log/broadcaster/*.log

    pipeline_stages:
      # Match only logfmt lines (starting with ts=)
      - match:
          selector: '{job="broadcaster"}'
          stages:
            # Only process lines starting with ts= (logfmt format)
            - regex:
                expression: '^ts='

            # Parse logfmt format (key=value pairs)
            - logfmt:
                mapping:
                  ts:
                  level:
                  component:
                  event:
                  profile:
                  target:
                  stream_id:
                  codec:
                  preset:
                  bitrate:
                  framerate:
                  gopsize:
                  exit_code:
                  duration_ms:
                  pid:
                  msg:

            # Extract labels for filtering and grouping
            - labels:
                level:
                component:
                event:
                profile:
                target:

            # Parse ISO8601 timestamp
      - timestamp:
          source: ts
          format: RFC3339

  # Webhook logs from mounted volume
  - job_name: webhook
    static_configs:
      - targets:
          - localhost
        labels:
          job: webhook
          __path__: /var/log/webhook/*.log

  # NGINX access logs
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log

    pipeline_stages:
      # Parse NGINX log format
      - regex:
          expression: '^\[(?P<timestamp>.*?)\] (?P<remote_addr>\S+) (?P<status>\d+) (?P<request_time>[\d.]+)'

      - labels:
          status:

      - timestamp:
          source: timestamp
          format: '02/Jan/2006:15:04:05 -0700'
