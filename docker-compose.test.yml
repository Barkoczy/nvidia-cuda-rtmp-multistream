version: '3.8'

services:
  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: webhook-staging
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - WEBHOOK_PORT=8090
    networks:
      - streaming

  nginx-rtmp-staging:
    image: nvidia-cuda-rtmp-multistream-nginx-rtmp-staging:latest
    container_name: nginx-rtmp-staging
    ports:
      - "1936:1935"    # RTMP
      - "8081:8080"    # HTTP/HLS
    volumes:
      - ./nginx.staging.conf:/usr/local/nginx/conf/nginx.conf:ro
      - ./broadcaster:/usr/local/bin/broadcaster:ro
      - ./hls_transcode:/usr/local/bin/hls_transcode:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./profiles.yml:/etc/broadcaster/profiles.yml:ro
      - ./broadcaster-logrotate:/etc/logrotate.d/broadcaster:ro
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    networks:
      - streaming
    depends_on:
      - webhook

  nginx-vts-exporter:
    image: sophos/nginx-vts-exporter:latest
    container_name: nginx-vts-exporter-staging
    command:
      - -nginx.scrape_uri=http://nginx-rtmp-staging:8080/status/format/json
    ports:
      - "9913:9913"
    depends_on:
      - nginx-rtmp-staging
    networks:
      - streaming

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-staging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - streaming

networks:
  streaming:
    driver: bridge

volumes:
  prometheus-data:
